<!doctype html>
<!--
  ⚠️ 定位说明（2026-08-20）：本文件是「远期独立平台形态」的探索原型，
  展示脱离 DSH 的完整控制台信息架构（概览/用例/套件/运行/基线/知识库/指标/权限/设置）。
  它不是 M5 的实现目标——M5 前端权威设计见 docs/ui-design.md（DSH overlay 5 Tab）
  与 design-system/rag-testing/。本文件的信息架构可作为 M6+ 或 ragtest serve
  独立服务模式下的 UI 参考。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAG 测试平台 · 运行详情 / 失败诊断 Demo</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-bg: #eff6ff;
      --success: #16a34a;
      --success-bg: #ecfdf5;
      --failure: #dc2626;
      --failure-bg: #fef2f2;
      --warning: #d97706;
      --warning-bg: #fffbeb;
      --text: #111827;
      --secondary: #6b7280;
      --sidebar: #0f172a;
      --sidebar-soft: #172033;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      line-height: 1.45;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, summary:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .app {
      display: grid;
      grid-template-columns: 196px minmax(0, 1fr);
      min-height: 100vh;
    }
    .sidebar {
      background: var(--sidebar);
      color: #cbd5e1;
      padding: 14px 0;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .brand {
      padding: 0 14px 14px;
      color: #f8fafc;
      font-weight: 700;
      letter-spacing: .06em;
      font-size: 12px;
    }
    .nav-item {
      width: 100%;
      border: 0;
      background: transparent;
      color: #94a3b8;
      text-align: left;
      padding: 8px 14px;
      border-left: 2px solid transparent;
    }
    .nav-item.active {
      color: #ffffff;
      background: var(--sidebar-soft);
      border-left-color: var(--primary);
    }
    .sidebar-foot {
      margin-top: auto;
      padding: 14px;
      color: #64748b;
      font-size: 11px;
      font-family: var(--mono);
      border-top: 1px solid rgba(148, 163, 184, .18);
    }

    .content {
      min-width: 0;
      max-width: 1780px;
      width: 100%;
      margin: 0 auto;
    }
    .topbar {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px 8px;
    }
    .crumb {
      color: var(--secondary);
      font-size: 12px;
      margin-bottom: 6px;
    }
    .run-head {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .title-wrap { min-width: 0; }
    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 650;
      letter-spacing: 0;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .meta {
      display: flex;
      gap: 8px 18px;
      flex-wrap: wrap;
      color: var(--secondary);
      font-size: 12px;
    }
    .meta b {
      color: var(--text);
      font-family: var(--mono);
      font-weight: 500;
    }
    .actions {
      margin-left: auto;
      display: flex;
      gap: 6px;
      flex: none;
    }
    .btn {
      min-height: 28px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 12px;
    }
    .btn:hover { background: #f3f4f6; }
    .btn.primary {
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
    }
    .btn.primary:hover { background: #1d4ed8; }
    .btn.icon { width: 30px; padding: 0; }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 20px;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .03em;
      font-family: var(--mono);
      white-space: nowrap;
    }
    .badge.failed, .status-fail {
      color: var(--failure);
      background: var(--failure-bg);
      border-color: #fecaca;
    }
    .badge.pass, .status-pass {
      color: var(--success);
      background: var(--success-bg);
      border-color: #bbf7d0;
    }
    .badge.warn, .status-warn {
      color: var(--warning);
      background: var(--warning-bg);
      border-color: #fde68a;
    }
    .badge.muted {
      color: var(--secondary);
      background: #f3f4f6;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .metric {
      padding: 9px 16px;
      border-right: 1px solid var(--border);
      min-width: 0;
    }
    .metric:last-child { border-right: 0; }
    .metric-label {
      color: var(--secondary);
      text-transform: uppercase;
      letter-spacing: .06em;
      font-size: 11px;
      margin-bottom: 2px;
    }
    .metric-value {
      font-family: var(--mono);
      font-size: 22px;
      line-height: 1.2;
      font-weight: 650;
    }
    .metric-sub {
      margin-top: 2px;
      color: var(--secondary);
      font-size: 12px;
    }
    .delta-down { color: var(--failure); }
    .delta-up { color: var(--warning); }

    .quality-gate {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      background: var(--failure-bg);
      border-bottom: 1px solid #fecaca;
      padding: 9px 16px;
      font-size: 12px;
    }
    .gate-title {
      color: var(--failure);
      font-weight: 650;
      min-width: 190px;
    }
    .gate-rules {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .gate-rule {
      border: 1px solid #fecaca;
      background: #fff;
      border-radius: 6px;
      padding: 6px 8px;
      min-width: 230px;
    }
    .rule-name {
      font-family: var(--mono);
      color: var(--failure);
      font-weight: 650;
      margin-bottom: 2px;
    }
    .rule-values {
      display: flex;
      gap: 12px;
      color: var(--secondary);
    }
    .rule-values b {
      color: var(--text);
      font-family: var(--mono);
      font-weight: 600;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(230px, 18%) minmax(0, 52%) minmax(330px, 30%);
      min-height: 640px;
      border-bottom: 1px solid var(--border);
    }
    .column {
      min-width: 0;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .column:last-child { border-right: 0; }
    .column-head {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      min-height: 44px;
    }
    .column-title {
      font-weight: 650;
      margin-right: auto;
    }
    .column-body {
      min-height: 0;
      overflow: auto;
    }
    .search {
      width: calc(100% - 24px);
      margin: 10px 12px 8px;
      height: 30px;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0 9px;
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
    }
    .filters {
      display: flex;
      gap: 5px;
      padding: 0 12px 8px;
    }
    .chip {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--secondary);
      border-radius: 4px;
      padding: 4px 8px;
      min-height: 26px;
      font-size: 12px;
    }
    .chip.active {
      color: var(--text);
      border-color: #9ca3af;
      background: #f3f4f6;
    }
    .case-item {
      display: block;
      width: 100%;
      border: 0;
      border-top: 1px solid var(--border);
      background: #fff;
      text-align: left;
      padding: 9px 10px 9px 12px;
      border-left: 3px solid transparent;
    }
    .case-item:hover { background: #f9fafb; }
    .case-item.active {
      background: var(--primary-bg);
      border-left-color: var(--primary);
    }
    .case-item.failed:not(.active) { border-left-color: var(--failure); }
    .case-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .case-id {
      font-family: var(--mono);
      font-weight: 650;
    }
    .case-title {
      color: var(--secondary);
      margin-top: 2px;
      font-size: 12px;
    }
    .case-reason {
      color: var(--failure);
      margin-top: 5px;
      font-family: var(--mono);
      font-size: 11px;
    }
    .case-empty {
      color: var(--secondary);
      padding: 16px 12px;
    }

    .section {
      padding: 11px 12px;
      border-bottom: 1px solid var(--border);
    }
    .section-title {
      margin: 0 0 8px;
      color: var(--secondary);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .05em;
      font-weight: 650;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .query-line {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 14px;
    }
    .query-line .btn { margin-left: auto; }
    .mono { font-family: var(--mono); }
    .muted { color: var(--secondary); }

    .pipeline {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }
    .stage {
      padding: 8px;
      border-right: 1px solid var(--border);
      position: relative;
      min-width: 0;
    }
    .stage:last-child { border-right: 0; }
    .stage::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--secondary);
    }
    .stage.pass::before { background: var(--success); }
    .stage.fail::before { background: var(--failure); }
    .stage.warn::before { background: var(--warning); }
    .stage-name {
      color: var(--secondary);
      font-size: 11px;
      margin-bottom: 5px;
    }
    .stage-status {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }
    .stage-latency {
      color: var(--secondary);
      font-family: var(--mono);
      font-size: 11px;
      white-space: nowrap;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th {
      text-align: left;
      color: var(--secondary);
      font-weight: 600;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      background: #fbfcfd;
    }
    td {
      padding: 7px 8px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
    }
    tr.expected-row td { background: #f0fdf4; }
    tr.problem-row td { background: var(--failure-bg); }
    .score {
      display: inline-grid;
      grid-template-columns: 42px 74px;
      gap: 6px;
      align-items: center;
      font-family: var(--mono);
    }
    .scorebar {
      height: 6px;
      background: #e5e7eb;
      border-radius: 3px;
      overflow: hidden;
    }
    .scorebar i {
      display: block;
      height: 100%;
      background: var(--primary);
    }
    .diagnosis-strip {
      border: 1px solid #fecaca;
      background: var(--failure-bg);
      color: var(--failure);
      border-radius: 6px;
      padding: 7px 8px;
      margin-top: 8px;
      font-size: 12px;
      font-weight: 600;
    }
    .answer-compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .answer-box {
      min-height: 116px;
      padding: 9px 10px;
      background: #fff;
    }
    .answer-box + .answer-box { border-left: 1px solid var(--border); }
    .answer-label {
      color: var(--secondary);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 5px;
      font-weight: 650;
    }
    mark {
      background: #fde68a;
      color: inherit;
      padding: 0 2px;
      border-radius: 2px;
    }
    .trend-wrap {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      padding: 8px;
    }
    .trend-svg {
      width: 100%;
      height: 122px;
      display: block;
    }
    .legend {
      display: flex;
      gap: 12px;
      color: var(--secondary);
      font-size: 12px;
      margin-top: 4px;
    }
    .legend i {
      display: inline-block;
      width: 16px;
      height: 2px;
      vertical-align: middle;
      margin-right: 5px;
    }

    .tabs {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    .switch-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      color: var(--secondary);
      font-size: 12px;
    }
    .switch {
      width: 36px;
      height: 20px;
      border: 0;
      border-radius: 999px;
      padding: 2px;
      background: #cbd5e1;
      position: relative;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      border-radius: 999px;
      background: #fff;
      transition: transform .15s ease;
    }
    .switch.on { background: var(--primary); }
    .switch.on::after { transform: translateX(16px); }
    .diagnosis-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .diagnosis-list li {
      border-bottom: 1px solid #f1f5f9;
      padding: 8px 0;
    }
    .diagnosis-list b {
      color: var(--failure);
      display: block;
      margin-bottom: 2px;
    }
    .trace-row {
      display: grid;
      grid-template-columns: 76px 58px minmax(0, 1fr) 44px;
      gap: 8px;
      align-items: center;
      padding: 5px 0;
      font-size: 12px;
    }
    .trace-name { font-weight: 600; }
    .trace-ms {
      color: var(--secondary);
      font-family: var(--mono);
      text-align: right;
    }
    .trace-bar {
      height: 8px;
      background: #e5e7eb;
      border-radius: 3px;
      overflow: hidden;
    }
    .trace-bar i {
      display: block;
      height: 100%;
      background: var(--primary);
    }
    .trace-row.max .trace-bar i { background: var(--warning); }

    details.fold {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    details.fold > summary {
      padding: 10px 16px;
      cursor: pointer;
      list-style: none;
      font-weight: 650;
      color: var(--secondary);
      border-top: 1px solid var(--border);
    }
    details.fold > summary::-webkit-details-marker { display: none; }
    details.fold[open] > summary {
      color: var(--text);
      border-bottom: 1px solid var(--border);
    }
    .fold-body {
      padding: 10px 16px 14px;
    }
    .pre {
      margin: 0;
      max-height: 260px;
      overflow: auto;
      white-space: pre-wrap;
      background: #111827;
      color: #e5e7eb;
      border-radius: 6px;
      padding: 10px;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.55;
    }
    .raw-head, .log-head {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .log-line {
      font-family: var(--mono);
      font-size: 12px;
      padding: 3px 0;
      color: var(--secondary);
    }
    .log-line.ERROR { color: var(--failure); }
    .log-line.WARN { color: var(--warning); }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: #111827;
      color: #fff;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      box-shadow: 0 8px 30px rgba(17, 24, 39, .24);
      z-index: 20;
    }

    @media (max-width: 1280px) {
      .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .workspace { grid-template-columns: 250px minmax(0, 1fr); }
      .eval-column {
        grid-column: 1 / -1;
        border-top: 1px solid var(--border);
      }
      .pipeline { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">RAG TEST OPS</div>
      <button class="nav-item">概览</button>
      <button class="nav-item">测试用例</button>
      <button class="nav-item">测试套件</button>
      <button class="nav-item active">测试运行</button>
      <button class="nav-item">基线管理</button>
      <button class="nav-item">知识库管理</button>
      <button class="nav-item">指标配置</button>
      <button class="nav-item">权限场景</button>
      <button class="nav-item">系统设置</button>
      <div class="sidebar-foot">env: demo<br />backend: mock</div>
    </aside>
    <main class="content">
      <section class="topbar">
        <div class="crumb">RAG 测试 / 运行详情 / <b>e2e_generation</b></div>
        <div class="run-head">
          <div class="title-wrap">
            <h1><span id="runName">e2e_generation</span> <span class="badge failed">FAILED</span></h1>
            <div class="meta" id="runMeta"></div>
          </div>
          <div class="actions">
            <button class="btn primary" id="rerunBtn">重新运行</button>
            <button class="btn" id="exportBtn">导出报告</button>
            <button class="btn icon" id="moreBtn" aria-label="更多操作">⋯</button>
          </div>
        </div>
      </section>

      <section class="metrics" id="metrics"></section>
      <section class="quality-gate" id="qualityGate"></section>

      <section class="workspace">
        <aside class="column">
          <div class="column-head">
            <div class="column-title">用例列表</div>
          </div>
          <div class="column-body">
            <input class="search" id="caseSearch" placeholder="搜索用例名称 / 关键词" />
            <div class="filters" id="caseFilters"></div>
            <div id="caseList"></div>
          </div>
        </aside>

        <section class="column">
          <div class="column-head">
            <div>
              <span class="column-title" id="caseHeading">Case Detail</span>
              <span class="muted mono" id="caseReason"></span>
            </div>
          </div>
          <div class="column-body" id="caseDetail"></div>
        </section>

        <aside class="column eval-column">
          <div class="column-head">
            <div class="column-title">Evaluation</div>
            <div class="tabs" id="evalTabs"></div>
            <div class="switch-row">
              与基线对比
              <button class="switch on" id="baselineSwitch" role="switch" aria-checked="true"></button>
            </div>
          </div>
          <div class="column-body" id="evaluation"></div>
        </aside>
      </section>

      <details class="fold" id="rawFold">
        <summary>&gt; 原始数据 Raw Data</summary>
        <div class="fold-body">
          <div class="raw-head">
            <div class="tabs" id="rawTabs"></div>
            <button class="btn" id="copyRawBtn">复制</button>
          </div>
          <pre class="pre" id="rawContent"></pre>
        </div>
      </details>

      <details class="fold" id="logsFold">
        <summary>&gt; 日志 Logs</summary>
        <div class="fold-body">
          <div class="log-head" id="logFilters"></div>
          <div id="logsContent"></div>
        </div>
      </details>
    </main>
  </div>

  <script>
    const mock = {
      run: {
        name: "e2e_generation",
        status: "failed",
        runId: "20260819-221047-f9e8d7",
        branch: "main",
        duration: "4m12s",
        trigger: "manual",
        baseline: "main-20260818-221015",
        startTime: "2026-08-19 22:10:47"
      },
      metrics: [
        { label: "通过率", value: "18 / 20", sub: "90.0%" },
        { label: "Recall@5", value: "0.84", sub: "Threshold 0.90  ↓ 6.7%", tone: "down" },
        { label: "Faithfulness", value: "0.81", sub: "Baseline 0.89  ↓ 8.7%", tone: "down" },
        { label: "P95 Latency", value: "1.95s", sub: "Baseline 1.82s  ↑ 7.1%", tone: "up" },
        { label: "Token / Case", value: "1,411", sub: "Baseline 1,320  ↑ 6.9%", tone: "up" }
      ],
      qualityGate: [
        { name: "Recall@5 < 0.90", current: "0.84", threshold: "0.90" },
        { name: "Faithfulness Regression", current: "0.81", baseline: "0.89", regression: "-8.7%" }
      ],
      cases: [

    function renderTrend() {

      const all = e2e.concat(evaluator.map((n) => n * 10));
      const min = Math.min(...all);
      const max = Math.max(...all);
      const points = (series, scale = 1) => series.map((value, index) => {
        const x = 14 + index * (452 / (series.length - 1));
        const normalized = ((value * scale) - min) / (max - min || 1);
        const y = 104 - normalized * 86;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(" ");
      return `
        <div class="trend-wrap">
          <svg class="trend-svg" viewBox="0 0 480 120" role="img" aria-label="最近 20 次运行延迟趋势">

            <polyline points="${points(e2e)}" fill="none" stroke="#2563eb" stroke-width="2" />
            <polyline points="${points(evaluator, 10)}" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3" />
            ${e2e.map((value, index) => {

          </div>

            <div class="answer-box">
              <div class="answer-label">Actual Answer</div>
              ${escapeHtml(item.actualAnswer).replace("武昌起义", "<mark>武昌起义</mark>").replace("折扣策略", "<mark>折扣策略</mark>")}
            </div>
            <div class="answer-box">
              <div class="answer-label">Expected Answer</div>
              ${escapeHtml(item.expectedAnswer).replace("四川保路运动", "<mark>四川保路运动</mark>").replace("权限不足", "<mark>权限不足</mark>")}
            </div>
          </div>
        </div>
        <div class="section">
          <div class="section-title">最近 20 次运行延迟趋势</div>
          ${renderTrend()}
        </div>
      `;
      $("copyQueryBtn").addEventListener("click", () => copyText(item.query, "Query"));
    }

    function metricDiff(row) {
      if (!state.baseline || typeof row.current !== "number" || typeof row.baseline !== "number") return "";
      const diff = row.current - row.baseline;
      const cls = diff < 0 ? "delta-down" : "delta-up";
      return `<td class="${cls} mono">${diff > 0 ? "+" : ""}${diff.toFixed(2)}</td>`;
    }

    function renderMetricTable(rows) {
      return `
        <table>
          <thead>
            <tr>
              <th>Metric</th>
              <th>Current</th>
              <th>Threshold</th>
              ${state.baseline ? "<th>Baseline</th><th>Diff</th>" : ""}
            </tr>
          </thead>
          <tbody>
            ${rows.map((row) => `
              <tr>
                <td>${row.metric}</td>
                <td class="mono">${fmt(row.current)}</td>
                <td class="mono">${fmt(row.threshold)}</td>
                ${state.baseline ? `<td class="mono">${fmt(row.baseline)}</td>${metricDiff(row)}` : ""}
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function renderTrace(item) {
      const max = Math.max(...item.pipeline.map((stage) => stage.ms));
      return item.pipeline.map((stage) => `
        <div class="trace-row ${stage.ms === max ? "max" : ""}">
          <span class="trace-name">${stage.name === "Evaluate" ? "Evaluator" : stage.name}</span>
          <span class="trace-ms">${stage.latency}</span>
          <span class="trace-bar"><i style="width:${Math.max(3, Math.round(stage.ms / max * 100))}%"></i></span>
          <span>${stage.ms === max ? "max" : ""}</span>
        </div>
      `).join("");
    }

    function renderEvaluation() {
      const item = selectedCase();
      const tabs = [
        ["retrieval", "Retrieval"],
        ["generation", "Generation"],
        ["safety", "Safety"],
        ["summary", "综合"]
      ];
      $("evalTabs").innerHTML = tabs.map(([key, label]) => `
        <button class="chip ${state.evalTab === key ? "active" : ""}" data-eval-tab="${key}">${label}</button>
      `).join("");
      const activeRows = state.evalTab === "summary"
        ? item.evaluation.retrieval.concat(item.evaluation.generation, item.evaluation.safety)
        : item.evaluation[state.evalTab];
      $("evaluation").innerHTML = `
        <div class="section">
          <div class="section-title">${tabs.find(([key]) => key === state.evalTab)[1]} Metrics</div>
          ${renderMetricTable(activeRows)}
        </div>
        <div class="section">
          <div class="section-title">失败原因</div>
          <ul class="diagnosis-list">
            ${item.failureDiagnosis.map((diag) => `
              <li><b>${diag.title}</b><span class="muted">${diag.detail}</span></li>
            `).join("")}
          </ul>
        </div>
        <div class="section">
          <div class="section-title">Trace / 耗时分布</div>
          ${renderTrace(item)}
        </div>
      `;
    }

    function renderRawData() {
      const tabs = Object.keys(mock.rawData);
      $("rawTabs").innerHTML = tabs.map((tab) => `
        <button class="chip ${state.rawTab === tab ? "active" : ""}" data-raw-tab="${tab}">${tab}</button>
      `).join("");
      const value = mock.rawData[state.rawTab];
      $("rawContent").textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
    }

    function renderLogs() {
      const filters = ["All", "INFO", "WARN", "ERROR"];
      $("logFilters").innerHTML = filters.map((level) => `
        <button class="chip ${state.logLevel === level ? "active" : ""}" data-log-level="${level}">${level}</button>
      `).join("");
      const rows = mock.logs.filter((line) => state.logLevel === "All" || line.level === state.logLevel);
      $("logsContent").innerHTML = rows.map((line) => `
        <div class="log-line ${line.level}">[${line.level}] ${line.time} ${line.message}</div>
      `).join("");
    }

    function renderAll() {
      renderRun();
      renderCaseNavigator();
      renderCaseDetail();
      renderEvaluation();
      renderRawData();
      renderLogs();
    }

    document.addEventListener("click", (event) => {
      const caseButton = event.target.closest("[data-case-id]");
      if (caseButton) {
        state.selectedCaseId = caseButton.dataset.caseId;
        renderCaseNavigator();
        renderCaseDetail();
        renderEvaluation();
      }

      const caseFilter = event.target.closest("[data-case-filter]");
      if (caseFilter) {
        state.caseFilter = caseFilter.dataset.caseFilter;
        renderCaseNavigator();
      }

      const evalTab = event.target.closest("[data-eval-tab]");
      if (evalTab) {
        state.evalTab = evalTab.dataset.evalTab;
        renderEvaluation();
      }

      const rawTab = event.target.closest("[data-raw-tab]");
      if (rawTab) {
        state.rawTab = rawTab.dataset.rawTab;
        renderRawData();
      }

      const logLevel = event.target.closest("[data-log-level]");
      if (logLevel) {
        state.logLevel = logLevel.dataset.logLevel;
        renderLogs();
      }
    });

    $("caseSearch").addEventListener("input", (event) => {
      state.caseSearch = event.target.value;
      renderCaseNavigator();
    });
    $("baselineSwitch").addEventListener("click", () => {
      state.baseline = !state.baseline;
      $("baselineSwitch").classList.toggle("on", state.baseline);
      $("baselineSwitch").setAttribute("aria-checked", String(state.baseline));
      renderEvaluation();
    });
    $("copyRawBtn").addEventListener("click", () => copyText($("rawContent").textContent, "Raw Data"));
    $("rerunBtn").addEventListener("click", () => showToast("已创建重新运行任务（Demo）"));
    $("exportBtn").addEventListener("click", () => showToast("报告导出已加入队列（Demo）"));
    $("moreBtn").addEventListener("click", () => showToast("更多操作：固定基线 / 查看 Artifact / 复制 Run ID"));

    renderAll();
  </script>
</body>
</html>
