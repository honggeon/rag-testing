    pass("gen_008", "手册", "公开手册休假天数？", "doc_public_handbook", "年假 5 天起。[^1]"),
    pass("gen_009", "术语", "RRF 在检索管线中的位置？", "doc_economy_overview", "融合 dense 与 BM25 之后。[^1]"),
    pass("gen_010", "边界", "空查询应如何处理？", "doc_public_handbook", "返回空结果。"),
    pass("gen_011", "时延", "检索是否在 2s 内返回？", "doc_shisanwu", "是。"),
    pass("gen_012", "格式", "回答是否含引用标记？", "doc_xinhai", "含 [^1]。"),
  ],
};

function pass(id, title, q, doc, answer) {
  return {
    id, title, status: "passed", q, expectDocs: [doc], facts: [], attr: "ok",
    reason: "All checks passed",
    retrieval: { ms: 128, chunks: [{ rank: 1, doc, chunk: "chunk_001", score: 0.91, exp: true, forbid: false, text: answer }] },
    answer,
    metrics: {
      retrieval: [{ n: "Recall@5", cur: 1, thr: 1, pass: true, base: 1 }, { n: "MRR", cur: 1, thr: 0.8, pass: true, base: 0.9 }],
      generation: [{ n: "Golden facts", cur: 1, thr: 1, pass: true, base: 1 }, { n: "Citation", cur: 1, thr: 1, pass: true, base: 1 }, { n: "Faithfulness", cur: null, thr: null, pass: null, base: null }],
      safety: [{ n: "Permission leak", cur: 0, thr: 0, pass: true, base: 0 }],
    },
    diag: [{ t: "全部检查通过", d: "Retrieval / Generation / Safety 均未破阈值。", ok: true }],
    stages: [
      { k: "query", l: "Query", s: "pass", ms: null },
      { k: "retrieve", l: "Retrieve", s: "pass", ms: 128 },
      { k: "rerank", l: "Rerank", s: "skipped", ms: null },
      { k: "context", l: "Context", s: "pass", ms: null },
      { k: "generate", l: "Generate", s: "pass", ms: 640 },
      { k: "evaluate", l: "Evaluate", s: "pass", ms: 28 },
    ],
    unavail: ["rerank_scores", "prompt"],
  };
}

const S = {
  scene: "fail",
  caseId: "gen_002",
  filter: "fail",
  q: "",
  base: true,
  evalTab: "retrieval",
  stage: null,
  rawTab: "json",
  logLv: "ALL",
  chunk: null,
  top20: false,
  gateOpen: false,
  toast: null,
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
function toast(m) { S.toast = m; render(); setTimeout(() => { if (S.toast === m) { S.toast = null; render(); } }, 1400); }
function badge(s) {
  if (s === "failed" || s === "fail") return `<span class="badge fail">FAILED</span>`;
  if (s === "pass" || s === "passed") return `<span class="badge ok">PASS</span>`;
  if (s === "warn") return `<span class="badge warn">WARN</span>`;
  if (s === "skipped") return `<span class="badge skip">SKIPPED</span>`;
  return `<span class="badge skip">${esc(s)}</span>`;
}
function fmt(v, kind) {
  if (v == null) return "—";
  if (kind === "ms") return Math.round(v) + "ms";
  if (typeof v === "number" && v <= 1) return v.toFixed(2);
  return String(v);
}
function pct(cur, base) {
  if (cur == null || base == null || !base) return "";
  const p = ((cur - base) / base) * 100;
  const sign = p > 0 ? "+" : "";
  return `${sign}${p.toFixed(1)}%`;
}
function caseOf() { return RUN.cases.find((c) => c.id === S.caseId) || RUN.cases[0]; }
function visibleCases() {
  const q = S.q.trim();
  return RUN.cases.filter((c) => {
    if (S.filter === "fail" && c.status !== "failed") return false;
    if (S.filter === "pass" && c.status !== "passed") return false;
    if (!q) return true;
    return (c.id + c.title + c.q).includes(q);
  }).sort((a, b) => (a.status === "passed") - (b.status === "passed"));
}

function rail() {
  const items = ["概览","测试用例","测试套件","测试运行","基线管理","知识库管理","指标配置","权限场景","系统设置"];
  return `<aside class="rail"><div class="brand">RAGTEST</div>
    ${items.map((n) => `<button type="button" class="${n==="测试运行"?"active":""}" ${n==="测试运行"?"":"disabled"}>${n}</button>`).join("")}
    <div class="rail-foot">host 半只读 artifacts</div></aside>`;
}

function header() {
  return `<div class="crumb">RAG 测试 / 运行详情 / <b>${RUN.suite}</b></div>
    <header class="hdr">
      <div>
        <h1>${RUN.suite} ${badge("failed")}</h1>
        <div class="meta">
          <span>Run ID <b>${RUN.run_id}</b></span>
          <span>Trigger <b>${RUN.trigger}</b></span>
          <span>Branch <b>${RUN.branch}</b></span>
          <span>Baseline <b>${S.base ? RUN.baselineName : "—"}</b></span>
          <span>Duration <b>${RUN.duration}</b></span>
          <span>Start <b>${RUN.started}</b></span>
          <span>emb <b>${RUN.fp.emb}</b></span>
          <span>llm <b>${RUN.fp.llm}</b></span>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-p" data-act="rerun">重新运行</button>
        <button class="btn" data-act="export">导出报告</button>
        <button class="btn" disabled>更多操作</button>
      </div>
    </header>`;
}

function metrics() {
  const s = RUN.summary, b = RUN.baseline, on = S.base;
  const cells = [
    ["通过率", fmt(s.pass_rate), on ? `Baseline ${fmt(b.pass_rate)}  ${pct(s.pass_rate,b.pass_rate)}` : "Threshold 0.95", s.pass_rate < 0.95 ? "fail" : "ok"],
    ["Recall@5", fmt(s.recall), on ? `Baseline ${fmt(b.recall)}  ${pct(s.recall,b.recall)}` : "Threshold 0.90", s.recall < 0.90 ? "fail" : "ok"],
    ["Golden facts", fmt(s.facts), on ? `Baseline ${fmt(b.facts)}  ${pct(s.facts,b.facts)}` : "Faithfulness 未启用（M6）", s.facts < 0.90 ? "fail" : "ok"],
    ["P95 Latency", fmt(s.p95,"ms"), on ? `Baseline ${fmt(b.p95,"ms")}  ${pct(s.p95,b.p95)}` : "Threshold ≤2000ms", "fail"],
    ["Token / Case", String(s.tokens), on ? `Baseline ${b.tokens}  ${pct(s.tokens,b.tokens)}` : "avg total_tokens", ""],
  ];
  return `<div class="metrics">${cells.map(([l,v,sub,t]) => `<div class="mc"><div class="l">${l}</div><div class="v">${v}</div><div class="s ${t}">${sub}</div></div>`).join("")}</div>`;
}

function gate() {
  return `<div class="gate" role="alert">
    <div><b>质量门失败：${RUN.gate.length} 个规则未通过</b>
      <div class="grules">${RUN.gate.map((g) => `<span>${esc(g.msg)} · Current <b>${fmt(g.cur)}</b> Threshold <b>${fmt(g.thr)}</b></span>`).join("")}</div>
      ${S.gateOpen ? `<table style="margin-top:8px"><thead><tr><th>规则</th><th>Current</th><th>Threshold</th></tr></thead><tbody>${RUN.gate.map((g)=>`<tr><td class="mono">${g.metric}</td><td class="mono">${fmt(g.cur)}</td><td class="mono">${fmt(g.thr)}</td></tr>`).join("")}</tbody></table>` : ""}
    </div>
    <button class="link" style="margin-left:auto" data-act="gate">${S.gateOpen?"收起规则":"查看规则详情"}</button>
  </div>`;
}

function nav() {
  const failN = RUN.cases.filter((c) => c.status === "failed").length;
  const passN = RUN.cases.filter((c) => c.status === "passed").length;
  const rows = visibleCases();
  return `<section class="col">
    <div class="ch">用例列表
      <span style="margin-left:auto;display:flex;gap:4px">
        <button class="chip" data-act="filter" data-v="all" aria-pressed="${S.filter==="all"}">全部 ${RUN.cases.length}</button>
        <button class="chip" data-act="filter" data-v="fail" aria-pressed="${S.filter==="fail"}">失败 ${failN}</button>
        <button class="chip" data-act="filter" data-v="pass" aria-pressed="${S.filter==="pass"}">通过 ${passN}</button>
      </span>
    </div>
    <div style="padding:8px 10px;border-bottom:1px solid var(--line)"><input class="search" placeholder="搜索 id / 问题" value="${esc(S.q)}" data-act="search" /></div>
    <div class="cb">${rows.map((c) => `<button class="ci ${c.status==="failed"?"f":"p"} ${c.id===S.caseId?"on":""}" data-act="case" data-id="${c.id}">
      <div><span class="id">${c.id}</span> ${badge(c.status)}</div>
      <div class="t">${esc(c.title)}</div>
      <div class="w">${esc(c.reason)}</div>
    </button>`).join("") || `<div class="empty">没有匹配的用例</div>`}</div>
  </section>`;
}

function detail() {
  const c = caseOf();
  const vis = visibleCases();
  const idx = vis.findIndex((x) => x.id === c.id);
  const chunks = c.retrieval.chunks;
  const shown = S.top20 ? chunks : chunks.slice(0, 5);
  const missing = (c.expectDocs || []).filter((d) => !chunks.some((x) => x.doc === d));
  const best = chunks.filter((x) => x.exp).map((x) => x.rank);
  const bestRank = best.length ? Math.min(...best) : null;
  const facts = c.facts || [];
  return `<section class="col">
    <div class="ch">
      <span class="mono">${c.id}</span> · ${esc(c.title)} ${badge(c.status)}
      <span style="margin-left:auto;display:flex;gap:4px">
        <button class="btn" data-act="prev" ${idx<=0?"disabled":""}>上一个</button>
        <button class="btn" data-act="next" ${idx<0||idx===vis.length-1?"disabled":""}>下一个</button>
      </span>
    </div>
    <div class="cb">
      <div class="blk">
        <h4>RAG Pipeline</h4>
        <div class="pipe">${c.stages.map((st) => `<button class="ps ${st.s} ${S.stage===st.k?"sel":""}" data-act="stage" data-k="${st.k}" title="${st.s}">
          <div class="n">${st.l}</div>${badge(st.s)}<div class="d">${st.ms==null?"—":st.ms>=1000?(st.ms/1000).toFixed(1)+"s":st.ms+"ms"}</div>
        </button>`).join("")}</div>
      </div>
      <div class="blk" id="stage-query"><h4>问题（Query） <button class="link" data-act="copy" data-t="${esc(c.q)}">复制</button></h4><div class="q">${esc(c.q)}</div></div>
      ${S.stage==="rerank" ? `<div class="empty">Rerank 分数 unavailable（arag 默认 rerank=off）。见 trace.unavailable。</div>` : ""}
      <div class="blk" id="stage-retrieve">
        <h4>检索结果 Top ${shown.length} <button class="link" data-act="top20">${S.top20?"只看 Top 5":"查看 Top 20"}</button></h4>
        ${missing.length ? `<p class="empty" style="padding:0 0 8px">Expected Chunk 未进入 TopK：${missing.join(", ")}</p>` : bestRank>1 ? `<p class="empty" style="padding:0 0 8px">Expected 已命中但排名过低（rank ${bestRank}）</p>` : ""}
        ${!chunks.length ? `<div class="empty">该用例未记录 Retrieval</div>` : `<table>
          <thead><tr><th>Rank</th><th>Document / Chunk</th><th>Score</th><th>Expected</th><th>Status</th></tr></thead>
          <tbody>${shown.map((r) => {
            let st = "Hit", tone = "skip";
            if (r.forbid) { st = "Forbidden"; tone = "fail"; }
            else if (r.exp && r.rank > 1) { st = "Rank Too Low"; tone = "warn"; }
            else if (r.exp) { st = "Hit"; tone = "ok"; }
            return `<tr class="${r.forbid?"fo":r.exp?"ex":""}">
              <td class="mono">${r.rank}</td>
              <td class="mono">${r.doc} / ${r.chunk}
                ${S.chunk===r.doc+r.chunk?`<div class="muted" style="font-family:var(--sans);margin-top:4px">${esc(r.text)}</div>`:""}
                <div><button class="link" data-act="chunk" data-k="${r.doc+r.chunk}">${S.chunk===r.doc+r.chunk?"收起 Chunk":"查看完整 Chunk"}</button></div>
              </td>
              <td><span class="sbar ${r.forbid?"fail":r.exp?"ok":""}"><i style="width:${Math.round(r.score*100)}%"></i></span> <span class="mono">${r.score.toFixed(2)}</span></td>
              <td>${r.exp?"Yes":"No"}</td>
              <td>${badge(tone==="fail"?"fail":tone==="ok"?"pass":tone==="warn"?"warn":"skip").replace("FAILED",st).replace("PASS",st).replace("WARN",st).replace("SKIPPED",st)}</td>
            </tr>`;
          }).join("")}</tbody></table>`}
      </div>
      <div class="blk" id="stage-generate">
        <h4>Actual vs Expected</h4>
        <div class="diff">
          <div><div class="k">Actual Answer</div>${c.answer ? esc(c.answer) : `<span class="muted">该用例未记录模型回答</span>`}</div>
          <div><div class="k">Expected Answer</div>${c.expect ? esc(c.expect) : `<span class="muted">该用例未配置 Expected Answer</span>`}${facts.length ? `<div class="muted" style="margin-top:8px">golden_facts：${facts.map((f) => c.answer && !c.answer.includes(f) ? `<mark>${esc(f)}</mark>` : esc(f)).join(" · ")}</div>` : ""}</div>
        </div>
      </div>
    </div>
  </section>`;
}

function evalPanel() {
  const c = caseOf();
  const tab = S.evalTab;
  const rows = c.metrics[tab] || [...c.metrics.retrieval, ...c.metrics.generation, ...c.metrics.safety];
  const emptyHint = {
    retrieval: "该用例没有 Retrieval 指标",
    generation: "Faithfulness / Correctness / Relevancy 属 M6 LLM Judge，本次未启用。",
    safety: "该用例没有 Safety 指标",
    all: "无指标",
  }[tab];
  const timed = c.stages.filter((s) => s.ms != null);
  const total = timed.reduce((a,s) => a + s.ms, 0) || 1;
  const list = tab === "all" ? [...c.metrics.retrieval, ...c.metrics.generation, ...c.metrics.safety] : rows;
  return `<section class="col eval">
    <div class="ch">Evaluation</div>
    <div class="cb">
      <div class="blk">
        <div class="tabs">
          ${["retrieval","generation","safety","all"].map((t) => `<button class="chip" data-act="etab" data-v="${t}" aria-pressed="${tab===t}">${t==="all"?"综合":t[0].toUpperCase()+t.slice(1)}</button>`).join("")}
        </div>
        ${!list.length ? `<div class="empty">${emptyHint}</div>` : `<table>
          <thead><tr><th>Metric</th><th>Current</th><th>Threshold</th>${S.base?"<th>vs Baseline</th>":""}<th></th></tr></thead>
          <tbody>${list.map((m) => `<tr>
            <td>${m.n}</td>
            <td class="mono">${m.cur==null?"—":fmt(m.cur)}</td>
            <td class="mono">${m.thr==null?"—":fmt(m.thr)}</td>
            ${S.base?`<td class="mono ${m.base!=null && m.cur!=null && m.cur<m.base?"fail":""}">${m.base==null?"暂无 Baseline":fmt(m.base)+"  "+pct(m.cur,m.base)}</td>`:""}
            <td>${m.pass==null?badge("skipped"):badge(m.pass?"pass":"fail")}</td>
          </tr>`).join("")}</tbody></table>`}
        ${tab==="generation" ? `<p class="empty" style="padding:8px 0 0">${emptyHint}</p>` : ""}
      </div>
      <div class="blk"><h4>失败原因</h4>
        <ul class="diag">${(c.diag||[]).map((d) => `<li class="${d.ok?"ok":""}">${esc(d.t)}<div class="d">${esc(d.d)}</div></li>`).join("")}</ul>
      </div>
      <div class="blk" id="stage-evaluate">
        <h4>Trace / 耗时分布</h4>
        ${c.unavail.length?`<p class="empty" style="padding:0 0 8px">unavailable: ${c.unavail.join(", ")}</p>`:""}
        ${timed.length?timed.map((s) => `<div class="tr"><span>${s.l}</span><span class="mono">${s.ms>=1000?(s.ms/1000).toFixed(1)+"s":s.ms+"ms"}</span><span class="hbar"><i style="width:${(s.ms/total*100).toFixed(1)}%"></i></span><span class="mono">${(s.ms/total*100).toFixed(1)}%</span></div>`).join(""):`<div class="empty">本次运行未记录 Trace</div>`}
      </div>
    </div>
  </section>`;
}

function raw() {
  const c = caseOf();
  const tabs = [["request","Request"],["response","Response"],["prompt","Prompt"],["chunks","Retrieved Chunks"],["output","Model Output"],["eval_in","Evaluator Input"],["eval_out","Evaluator Output"],["json","Raw JSON"]];
  let body = "";
  if (S.rawTab === "prompt") body = "prompt 全文 unavailable（agent 不落盘 prompt）";
  else if (S.rawTab === "chunks") body = JSON.stringify(c.retrieval.chunks, null, 2);
  else if (S.rawTab === "output") body = JSON.stringify({ answer: c.answer }, null, 2);
  else if (S.rawTab === "request") body = JSON.stringify({ query: c.q, identity: "reader" }, null, 2);
  else if (S.rawTab === "response") body = JSON.stringify({ path: `raw/${c.id}.chat.json` }, null, 2);
  else if (S.rawTab === "eval_in") body = JSON.stringify({ expect: c.expectDocs, facts: c.facts }, null, 2);
  else if (S.rawTab === "eval_out") body = JSON.stringify({ attr: c.attr, metrics: c.metrics }, null, 2);
  else body = JSON.stringify({ run_id: RUN.run_id, case_id: c.id, attr: c.attr }, null, 2);
  return `<details class="cl" ${S._rawOpen?"open":""}><summary>原始数据 Raw Data</summary><div class="clb">
    <div class="tabs">${tabs.map(([id,l]) => `<button class="chip" data-act="rtab" data-v="${id}" aria-pressed="${S.rawTab===id}">${l}</button>`).join("")}
      <button class="link" data-act="copy" data-t="${esc(body)}">复制</button></div>
    <pre class="pre">${esc(body)}</pre>
  </div></details>`;
}

function logs() {
  const rows = RUN.lifecycle.filter((r) => S.logLv === "ALL" || r[0] === S.logLv);
  return `<details class="cl"><summary>Logs</summary><div class="clb">
    <p class="empty" style="padding:0 0 8px">本次运行未提供独立日志文件。以下由 lifecycle + gate 合成。</p>
    <div class="tabs">${["ALL","ERROR","WARN","INFO"].map((lv) => `<button class="chip" data-act="log" data-v="${lv}" aria-pressed="${S.logLv===lv}">${lv}</button>`).join("")}</div>
    ${rows.map((r) => `<div class="log ${r[0]}">${r[0].padEnd(5)} [${r[1]}] ${esc(r[2])}</div>`).join("") || `<div class="empty">无匹配日志</div>`}
  </div></details>`;
}

function renderFail() {
  return `${rail()}<div class="main">
    ${header()}
    <div class="bar-opt"><label><input type="checkbox" data-act="base" ${S.base?"checked":""}/> 与基线对比</label>
      <span>指纹一致，可对比 · rerank=${RUN.fp.rerank}</span></div>
    ${metrics()}${gate()}
    <div class="ws">${nav()}${detail()}${evalPanel()}</div>
    ${raw()}${logs()}
    ${S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:""}
  </div>`;
}

function render() {
  document.querySelectorAll(".demo-bar [data-scene]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.scene === S.scene)));
  if (S.scene === "loading") {
    $("app").innerHTML = `${rail()}<div class="main"><div class="empty">加载运行详情…</div></div>`;
    return;
  }
  if (S.scene === "empty") {
    $("app").innerHTML = `${rail()}<div class="main"><div class="crumb">RAG 测试 / 运行详情</div><div class="empty">还没有运行记录。到套件页跑 smoke。</div></div>`;
    return;
  }
  if (S.scene === "timeout") {
    $("app").innerHTML = `${rail()}<div class="main"><div class="crumb">RAG 测试 / 运行详情 / <b>e2e_generation</b></div>
      <header class="hdr"><div><h1>e2e_generation <span class="badge warn">TIMEOUT</span></h1>
      <div class="meta"><span>Run ID <b>20260819-221047-f9e8d7</b></span><span>Duration <b>10m00s</b></span></div></div></header>
      <div class="empty">运行超时。heartbeat 超过 30s 未刷新后由 host 标记。日志见下方 CLEANUP。</div></div>`;
    return;
  }
  if (S.scene === "nobase") {
    const keep = S.base; S.base = false;
    $("app").innerHTML = renderFail().replace("与基线对比", "与基线对比（暂无 Baseline / 指纹不可比）");
    S.base = keep;
    return;
  }
  $("app").innerHTML = renderFail();
}

document.querySelector(".demo-bar").addEventListener("click", (e) => {
  const b = e.target.closest("[data-scene]");
  if (!b) return;
  S.scene = b.dataset.scene;
  render();
});

$("app").addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const a = t.dataset.act;
  if (a === "case") S.caseId = t.dataset.id;
  else if (a === "filter") S.filter = t.dataset.v;
  else if (a === "prev") { const vis = visibleCases(); const i = vis.findIndex((c)=>c.id===S.caseId); if (i>0) S.caseId = vis[i-1].id; }
  else if (a === "next") { const vis = visibleCases(); const i = vis.findIndex((c)=>c.id===S.caseId); if (i>=0 && i<vis.length-1) S.caseId = vis[i+1].id; }
  else if (a === "stage") S.stage = t.dataset.k;
  else if (a === "etab") S.evalTab = t.dataset.v;
  else if (a === "rtab") S.rawTab = t.dataset.v;
  else if (a === "log") S.logLv = t.dataset.v;
  else if (a === "chunk") S.chunk = S.chunk === t.dataset.k ? null : t.dataset.k;
  else if (a === "top20") S.top20 = !S.top20;
  else if (a === "gate") S.gateOpen = !S.gateOpen;
  else if (a === "copy") { navigator.clipboard.writeText(t.dataset.t || "").then(() => toast("已复制")); return; }
  else if (a === "rerun") { toast("将 POST /plugins/rag-testing/api/runs（Demo 未接引擎）"); return; }
  else if (a === "export") { toast("Demo：导出 run.json"); return; }
  render();
});
$("app").addEventListener("change", (e) => {
  if (e.target.dataset.act === "base") { S.base = e.target.checked; render(); }
});
$("app").addEventListener("input", (e) => {
  if (e.target.dataset.act === "search") { S.q = e.target.value; render(); const el = $("app").querySelector("[data-act=search]"); if (el) { el.focus(); el.setSelectionRange(S.q.length, S.q.length); } }
});

render();
</script>
</body>
